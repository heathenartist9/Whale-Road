<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Gavel Fever</title>
<style>
:root {
  --bg: #140e0a;
  --ink: #f6efe2;
  --muted: #d9cbb6;
  --gold: #e4b15a;
  --gold-deep: #a57832;
  --wood: #2a1c12;
  --paper: #f4ecda;
  --paper-ink: #241c14;
  --plaintiff: #c4524a;
  --defendant: #3d86ad;
  --good: #7dcea0;
  --bad: #e07a70;
  --line: rgba(228, 177, 90, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.4;
  overflow-x: hidden;
}
.paper p, .choice, .nm, .plate, h2 { overflow-wrap: anywhere; }

button, input { font: inherit; color: inherit; }

button { cursor: pointer; }

#app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(228, 177, 90, 0.14), transparent 46%),
    var(--bg);
}
#app:has(.scroll) {
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
}

.scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 12px 12px;
}

.top {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 6px;
}

.brandblock { flex: 1; min-width: 0; }

.brand {
  font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  font-weight: 800;
  letter-spacing: 0.08em;
  font-size: 15px;
  color: #f3e2b8;
}

.topstat {
  margin-top: 2px;
  font-size: 13px;
  color: var(--muted);
}

.topstat b { color: var(--gold); font-variant-numeric: tabular-nums; }

.goalchip {
  display: inline-block;
  margin-top: 4px;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #1a120c;
  background: var(--gold);
  border-radius: 999px;
  padding: 2px 8px;
  font-weight: 700;
}

.iconbtn {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 12px;
  background: var(--wood);
  border: 1px solid var(--line);
  color: var(--ink);
  font-weight: 800;
}

.court {
  position: relative;
  height: 228px;
  margin: 0 12px;
  border-radius: 18px;
  overflow: hidden;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 8px),
    radial-gradient(ellipse at 50% 0%, rgba(255, 220, 160, 0.22), transparent 55%),
    linear-gradient(#4a301c, #24160e 72%);
  box-shadow: inset 0 0 0 2px rgba(228, 177, 90, 0.35), 0 12px 24px rgba(0, 0, 0, 0.35);
  flex: none;
}

.court.compact { height: 158px; }

.court.shake { animation: shake 0.4s linear; }

.onair, .bug {
  position: absolute;
  top: 8px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  z-index: 2;
}

.onair { left: 10px; color: #ffb4ae; display: flex; align-items: center; gap: 5px; }
.onair i {
  width: 8px; height: 8px; border-radius: 50%; background: #e23b32;
  box-shadow: 0 0 8px #e23b32;
  animation: pulse 1.4s infinite;
}
.bug { right: 10px; color: var(--gold); }

.signboard {
  text-align: center;
  padding-top: 8px;
  font-family: Georgia, serif;
  letter-spacing: 0.22em;
  font-size: 12px;
  font-weight: 800;
  color: #f3e2b8;
}

.sign-neon .signboard {
  color: #ffe7a8;
  text-shadow: 0 0 8px #e4b15a, 0 0 18px rgba(228, 177, 90, 0.8);
}

.heads {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 6px 92px 0 12px;
  min-height: 28px;
}

.gallery-velvet .heads {
  background: linear-gradient(#6e2438, #4a1828);
  border-radius: 10px;
  padding: 4px 6px 6px;
  margin-top: 4px;
}

.head {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 38%, #f0c7a4, #c48a5a 70%, #2a1a10 71%);
  position: relative;
}

.head:before {
  content: "";
  position: absolute;
  left: 2px; right: 2px; top: 0; height: 9px;
  border-radius: 10px 10px 3px 3px;
  background: hsl(calc(var(--h) * 48), 28%, 18%);
}

.react-laugh .head, .react-applause .head { animation: hop 0.5s calc(var(--h) * 40ms); }
.react-gasp .head { animation: gasp 0.45s calc(var(--h) * 30ms); }
.react-boo .head { animation: boo 0.45s; }

.well {
  position: absolute;
  left: 8px; right: 8px; bottom: 8px;
  display: grid;
  grid-template-columns: 1fr 1.05fr 1fr;
  gap: 6px;
  align-items: end;
}

.pod, .bench {
  border-radius: 12px;
  text-align: center;
  padding: 4px 4px 6px;
  min-width: 0;
}

.pod {
  background: rgba(0, 0, 0, 0.28);
  border-top: 4px solid var(--plaintiff);
}
.pod.d { border-top-color: var(--defendant); }
.pod.active { outline: 2px solid var(--gold); background: rgba(228, 177, 90, 0.12); }

.bench {
  background: linear-gradient(#6b4428, #3a2415);
  box-shadow: 0 7px 0 #24160e;
}
.bench-mahogany .bench { background: linear-gradient(#6a2c24, #3a1410); }

.nm, .plate {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #f6efe2;
  margin-top: 2px;
}

.plate.gold { color: #1a120c; background: linear-gradient(#f0d48a, #c4923e); border-radius: 6px; padding: 1px 4px; }

.gavel-btn {
  width: 48px;
  height: 36px;
  padding: 0;
  border: none;
  background: transparent;
  display: block;
  margin: 0 auto;
}

.gavel { width: 46px; height: 32px; display: block; overflow: visible; }
.gavel .art { transform-origin: 24px 18px; }
.gavel.banging .art { animation: bang 0.42s ease; }

.bailiff {
  position: absolute;
  top: 26px;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px 2px 2px;
  z-index: 2;
}
.bailiff em { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; }
.bailiff.dress { box-shadow: inset 0 0 0 2px var(--gold); }

.robe-silk .bench .avatar { filter: drop-shadow(0 0 4px rgba(228, 177, 90, 0.8)); }

.light-chandelier {
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0 2px, transparent 2px 8px),
    radial-gradient(circle at 50% 0%, rgba(255, 236, 190, 0.5), transparent 42%),
    linear-gradient(#5a3c22, #24160e 72%);
}

.react-banner {
  position: absolute;
  left: 50%;
  bottom: 78px;
  transform: translateX(-50%) translateY(6px);
  background: #1a120c;
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}
.react-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); transition: 0.2s ease; }

.court.compact .heads { display: none; }
.court.compact .bailiff { top: 22px; }
.court.compact .bailiff em { display: none; }
.court.compact .avatar { width: 40px !important; height: 40px !important; }

.paper {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.45), transparent 30%),
    var(--paper);
  color: var(--paper-ink);
  border-radius: 16px;
  padding: 14px;
  margin: 10px 0;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
}

.paper h2, .poster h1, .wordmark {
  font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  line-height: 1.05;
  margin: 0;
}

.paper h2 { font-size: 24px; }
.paper h3 { margin: 0 0 4px; font-size: 16px; }
.paper p { margin: 8px 0 0; }
.kicker {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #8a5a28;
}
.who { display: flex; gap: 10px; align-items: center; }
.who .meta { min-width: 0; }
.role { color: #6d5b48; font-size: 14px; }

.ribbon {
  display: inline-block;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 2px 8px;
}
.ribbon.p { background: #f3c7c2; color: #6e241e; }
.ribbon.d { background: #c9e2f0; color: #16384a; }
.ribbon.w { background: #e6d7b8; color: #4a3418; }
.ribbon.hot { background: #2a1c12; color: #f3e2b8; }
.ribbon.new { background: #d9efe3; color: #1d4a32; }
.ribbon.warn { background: #f8d0cc; color: #6e241e; }

.stamp {
  display: inline-block;
  border: 3px solid #a33b32;
  color: #a33b32;
  font-weight: 800;
  letter-spacing: 0.14em;
  transform: rotate(-6deg);
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 6px;
}

.choice, .go, .ghost, .toggle {
  width: 100%;
  min-height: 56px;
  border-radius: 14px;
  padding: 10px 12px;
  text-align: left;
  margin-bottom: 8px;
}

.choice {
  background: var(--wood);
  border: 1px solid var(--line);
  color: var(--ink);
}
.choice small, .toggle small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px; }
.choice.selected { background: var(--gold); color: #1a120c; border-color: var(--gold); }
.choice.selected small { color: #4a3418; }
.choice:disabled { opacity: 0.45; }
.choice b { font-weight: 750; }

.go {
  background: linear-gradient(#f0d48a, #c4923e);
  color: #1a120c;
  border: none;
  font-weight: 800;
  text-align: center;
}
.go:disabled { opacity: 0.4; }
.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  text-align: center;
  font-weight: 700;
}
.toggle {
  background: #20160f;
  border: 1px solid var(--line);
  text-align: left;
}

.dock {
  flex: none;
  padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, #140e0a 18%);
}
.dock .go, .dock .ghost { margin: 0; }

.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

.tabs { display: flex; gap: 6px; margin: 8px 0; }
.tabs button {
  flex: 1;
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #20160f;
  font-weight: 700;
  font-size: 14px;
}
.tabs button.on { background: var(--gold); color: #1a120c; border-color: var(--gold); }

.pips { letter-spacing: 2px; color: var(--gold); font-size: 14px; }

.sliderbox { margin-top: 8px; }
input[type="range"] {
  width: 100%;
  height: 44px;
  accent-color: #a57832;
}
.moneybig {
  font-family: Georgia, serif;
  font-size: 32px;
  margin: 0;
}

.bar {
  height: 10px;
  border-radius: 99px;
  background: rgba(36, 28, 20, 0.12);
  overflow: hidden;
  margin-top: 4px;
}
.bar > span { display: block; height: 100%; background: #8a5a28; border-radius: 99px; }
.bar.j > span { background: #2f7d57; }
.bar.r > span { background: #a33b32; }
.bar.p > span { background: #1f4e79; }

.meterline { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }

.poster {
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(22px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 50% 12%, rgba(228, 177, 90, 0.24), transparent 42%),
    linear-gradient(180deg, #3a2416, #140e0a 52%);
}
.kicker.light { color: var(--gold); }
.wordmark {
  font-size: 64px;
  color: #f6ead2;
  text-shadow: 0 3px 0 #6a4a1e, 0 14px 28px rgba(0, 0, 0, 0.45);
  letter-spacing: -1px;
  margin: 8px 0 0;
}
.tagline { margin: 8px 0 0; color: var(--muted); font-size: 18px; }
.poster .gavel-hero { width: 180px; height: 120px; margin: 12px auto 4px; }
.poster .gavel-hero .gavel { width: 180px; height: 110px; }
.fine { color: #b5a48e; font-size: 13px; margin-top: auto; padding-top: 16px; }
.quote { color: #f3e2b8; font-family: Georgia, serif; font-size: 16px; margin: 8px 0 14px; }

.sheet { padding: calc(12px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)); }
.nameinput {
  width: 100%;
  min-height: 56px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #20160f;
  padding: 0 12px;
  font-size: 20px;
  margin: 10px 0;
}

.listy { margin: 6px 0 0; padding-left: 18px; }
.listy li { margin: 4px 0; }

.ach {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px solid rgba(228, 177, 90, 0.15);
}
.ach .mark {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  background: #3a2a18; color: var(--gold); font-weight: 800; flex: none;
}
.ach.on .mark { background: var(--gold); color: #1a120c; }
.ach p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.toast {
  position: fixed;
  left: 12px; right: 12px;
  bottom: calc(16px + env(safe-area-inset-bottom));
  background: #f4ecda;
  color: #241c14;
  border-radius: 14px;
  padding: 12px 14px;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  z-index: 5;
}

.confirmback {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.62);
  display: flex; align-items: flex-end;
  z-index: 6;
  padding: 12px;
}
.confirmback .paper { width: 100%; }

.delta { font-variant-numeric: tabular-nums; font-weight: 800; }
.up { color: #1d6b42; }
.down { color: #8d2d32; }

@media (max-height: 700px) {
  .court { height: 180px; }
  .court.compact { height: 136px; }
  .wordmark { font-size: 52px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

@keyframes bang {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(-32deg); }
  45% { transform: rotate(8deg); }
  65% { transform: rotate(-18deg); }
  100% { transform: rotate(0deg); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
@keyframes hop {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes gasp {
  0%, 100% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-3px) scale(1.08); }
}
@keyframes boo {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-6deg); }
  75% { transform: rotate(6deg); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

</style>
</head>

<script>
"use strict";
const CASES = [
  {
    id: "goat-pumpkins",
    title: "The Goat and the Blue Ribbon",
    tier: 1, claim: 2400, counter: 0, baseDrama: 10,
    cast: ["doug", "nana"],
    plaintiff: { name: "Nana Pritchard", role: "Pumpkin grower", seed: "nana-pritchard", trait: "cardigan, iron spine", statement: "Chairman the goat entered my beds at dawn and ate three prize pumpkins, including Blue Ribbon Betty. I want the pumpkins, the ribbon I was going to win, and a little something for the feeling of hoofprints where a dream used to be." },
    defendant: { name: "Doug Pemble", role: "Neighbor to the goat", seed: "doug-pemble", trait: "cheerful, muddy", statement: "Chairman is a gentleman. If he sampled a gourd, the gate was already open. I offered to fix that latch in May. Nana said she liked it seasoned." },
    witness: { name: "Timmy Bale", role: "Paper kid, unfortunately observant", seed: "timmy-bale", statement: "I saw the goat in the pumpkins. I also saw the latch hanging like a noodle. Both things can be true. Please don't make me say noodle again." },
    evidence: [
      { id: "hoof", kind: "Photo", title: "Hoofprints in the mulch", key: true, body: "Cloven prints through the marigolds and up to a pumpkin that has been edited. A tuft of gray goat hair is caught on the twine." },
      { id: "orange", kind: "Texts", title: "Doug, 11:41 p.m.", key: true, body: "Doug to his cousin: 'Chairman is a free spirit tonight. If he comes home orange, mind your business.' Sent six hours before Nana called." },
      { id: "seeds", kind: "Receipt", title: "Seed receipt", key: false, body: "Nana spent $36 on seeds and $12 on spray. Nothing here promises a ribbon. The fair's rules say judges may withhold prizes for produce that is mostly missing." },
    ],
    questions: [
      { id: "g1", to: "plaintiff", ask: "Nana, had anyone promised you that ribbon in writing?", answer: "Well. No. But Betty had a presence. The goat ate a presence.", drama: 2, key: false, flag: "" },
      { id: "g2", to: "plaintiff", ask: "What did you tell Doug when he offered to fix the latch?", answer: "I said the latch had character. I did not say the goat could have a salad bar.", drama: 3, key: true, flag: "new" },
      { id: "g3", to: "defendant", ask: "Doug, explain the text about Chairman coming home orange.", answer: "That was a joke between men. It is also, I hear it now, a confession. Huh.", drama: 6, key: true, flag: "contradiction" },
      { id: "g4", to: "defendant", ask: "Is Chairman insured, or is he just famous?", answer: "Famous locally. Insurance said goats are a lifestyle. I think they were being rude.", drama: 8, key: false, flag: "" },
      { id: "g5", to: "witness", ask: "Which came first, the open latch or the goat?", answer: "The latch was dangling at sunrise. The goat was already inside, chewing like he paid rent.", drama: 2, key: true, flag: "new" },
      { id: "g6", to: "witness", ask: "Did you see Doug push the goat in?", answer: "No. The goat let himself in. He looked proud, which I know is not evidence, but it was rude.", drama: 5, key: false, flag: "" },
    ],
    objection: { when: "statements", from: "Doug Pemble", line: "Objection! She's testifying about a pumpkin's inner life!", grounds: "Nana called the pumpkin a colleague.", sustainFair: true, sustainDrama: 3, overruleDrama: 8, sustainNote: "Sustained. Betty can be delicious without being a person.", overruleNote: "Overruled. The gallery is now emotionally invested in a gourd." },
    outburst: { from: "Doug Pemble", line: "CHAIRMAN IS A GENTLEMAN AND HE WAS INVITED BY A LATCH." },
    truth: { winner: "split", damages: 800, counter: 0, summary: "Chairman ate the pumpkins, and Doug knew the goat was out. The ribbon was never a sure thing, and Nana refused a free latch repair. Fair money is the produce, about $800, not the prize and not the heartbreak." },
    remarks: [
      { id: "dry", tag: "By the book", text: "The goat ate the evidence. The ribbon was a wish. I am pricing the wish at zero.", drama: 3, justice: 5 },
      { id: "wit", tag: "For the clip", text: "Chairman is remanded to his yard. Nana, your latch is remanded to a hardware store.", drama: 8, justice: 2 },
      { id: "hot", tag: "For the crowd", text: "I want that goat in a tiny bow tie, and I want him to look ashamed.", drama: 14, justice: -8 },
    ],
  },
  {
    id: "deposit",
    title: "The Deposit That Went on Vacation",
    tier: 1, claim: 1200, counter: 0, baseDrama: 6,
    plaintiff: { name: "Maya Ellison", role: "Former roommate", seed: "maya-ellison", trait: "organized, furious", statement: "Chris collected the twelve-hundred-dollar deposit from the landlord and invented a cleaning opera. I want my money. The apartment was cleaner than Chris's excuses." },
    defendant: { name: "Chris Dalca", role: "Roommate who 'handled it'", seed: "chris-dalca", trait: "spreadsheet energy", statement: "I deducted a hole in the wall and a reasonable cleaning fee. Maya is suing me for arithmetic. The landlord sent the check to me because I was the one who answered the phone." },
    witness: { name: "Ellis Cho", role: "Landlord's clerk", seed: "ellis-cho", statement: "We refunded twelve hundred to Chris. Our inspector noted one dartboard hole. We did not charge a cleaning fee. That part is new to me, and I see a lot of new parts." },

    const buf = this.noise(opts.dur);
    if (!buf) return;

    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = opts.filter || "bandpass";
    filter.frequency.value = opts.freq || 800;
    filter.Q.value = opts.q || 0.7;
    const gain = ctx.createGain();
    const t = ctx.currentTime + (opts.delay || 0);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(opts.gain || 0.08, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + opts.dur);

    src.stop(t + opts.dur);

  gavel(kind) {

    const base = kind === "crystal" ? 180 : kind === "brass" ? 95 : 120;
    this.burst({ dur: 0.09, freq: 1600, gain: 0.12, q: 0.8 });

  gasp() {

function scoreCurrent() {
  const c = current();
  const r = G.runtime;
  const t = c.truth;
  let justice = 0;
  const reasonsJ = [];
  const reasonsR = [];
  if (r.ruling === t.winner) {
    justice += 44;
    reasonsJ.push(t.winner === "split" ? "You split it, and the blame really was shared." : "You named the right side of the room.");
  } else if (r.ruling === "split" || t.winner === "split") {
    justice += 20;
    reasonsJ.push("Close. The blame was messier than the ruling.");
  } else {
    justice += 4;
    reasonsJ.push("That ruling pointed the wrong way.");
  }
  const span = Math.max(c.claim, 1);
  const ratio = Math.abs((r.damages || 0) - t.damages) / span;
  if (ratio <= 0.08) {
    justice += 26;
    reasonsJ.push("The number was almost exact.");
  } else if (ratio <= 0.2) {
    justice += 16;
    reasonsJ.push("The money was in the neighborhood.");
  } else if (ratio <= 0.4) {
    justice += 8;
    reasonsJ.push("The money was a rough sketch.");
  } else reasonsJ.push("The damages missed the fair mark.");
  const fairC = t.counter || 0;
  const gotC = r.counterOn ? r.counterAmt || 0 : 0;
  const cSpan = Math.max(c.counter || fairC, 1);
  if (fairC === 0 && gotC === 0) justice += 14;
  else if (Math.abs(gotC - fairC) / cSpan <= 0.15) {
    justice += 14;
    reasonsJ.push("The counterclaim was handled cleanly.");
  } else if (Math.abs(gotC - fairC) / cSpan <= 0.4) {
    justice += 6;
    reasonsJ.push("The counterclaim was half-right.");
  } else reasonsJ.push("The counterclaim went sideways.");
  const keys = (c.questions || []).filter((q) => q.key);
  const found = keys.filter((q) => r.asked.includes(q.id)).length;
  if (keys.length) {
    justice += Math.round((10 * found) / keys.length);
    if (found) reasonsJ.push("You uncovered " + found + " of " + keys.length + " soft spots.");
    else reasonsJ.push("The revealing questions stayed in your pocket.");
  }
  const keyEv = (c.evidence || []).filter((e) => e.key);
  const seenEv = keyEv.filter((e) => r.inspected.includes(e.id)).length;
  if (seenEv) justice += Math.min(6, seenEv * 2);
  if (keyEv.length && seenEv < keyEv.length) reasonsJ.push("A key exhibit stayed in the folder.");
  if (c.objection && r.objectionChoice) {
    const good = (r.objectionChoice === "sustain") === !!c.objection.sustainFair;
    justice += good ? 8 : -5;
    reasonsJ.push(good ? "Your objection call was sound." : "The objection call was the noisy one.");
  }
  const remark = (c.remarks || []).find((m) => m.id === r.remark);
  if (remark) justice += remark.justice || 0;
  justice = clamp(Math.round(justice));

  let ratings = 24 + (c.baseDrama || 0);
  reasonsR.push("The room was awake.");
  r.asked.forEach((id) => {
    const q = c.questions.find((item) => item.id === id);
    if (q) ratings += q.drama || 0;
  });
  if (r.asked.some((id) => ((c.questions.find((q) => q.id === id) || {}).drama || 0) >= 7)) reasonsR.push("A spicy question landed.");
  if (c.objection && r.objectionChoice) {
    ratings += r.objectionChoice === "sustain" ? c.objection.sustainDrama || 3 : c.objection.overruleDrama || 8;
    if ((c.objection.overruleDrama || 0) >= (c.objection.sustainDrama || 0) + 3 && r.objectionChoice === "overrule") {
      reasonsR.push("Overruling played to the cheap seats.");
    }
  }
  if (remark) {
    ratings += remark.drama || 0;
    if ((remark.drama || 0) >= 10) reasonsR.push("The closing line will be a clip.");
    else if ((remark.drama || 0) <= 4) reasonsR.push("The closing was dignified, and a little quiet.");
  }
  if (r.damages === 0 || r.damages === c.claim) {
    ratings += 6;
    reasonsR.push("A hard number. The gallery loves a hard number.");
  }
  if (r.ruling === "split") ratings += 3;
  ratings += Math.min(10, (r.gavelTaps || 0) * 2);
  if ((r.gavelTaps || 0) >= 2) reasonsR.push("You used the gavel like a percussion section.");
  if (c.outburst) ratings += 4;
  ratings = clamp(Math.round(ratings));
  const result = {
    justice, ratings, reasonsJ, reasonsR, found, ruling: r.ruling, damages: r.damages || 0,
    claim: c.claim, fairDamages: t.damages, fairWinner: t.winner, remark,
  };
  result.audience = audienceFor(result);
  return result;
}

function audienceFor(s) {
  if (s.justice >= 80 && s.ratings < 48) return { kind: "murmur", line: "Respectful silence. Dex looks personally wounded." };
  if (s.ratings >= 82 && s.justice < 40) return { kind: "applause", line: "The gallery is on its feet. The legal advisor puts their head in their hands." };
  if (s.ratings >= 70 && s.justice >= 70) return { kind: "applause", line: "They laugh, then they nod, which is the whole show." };
  if (s.ratings >= 68) return { kind: "laugh", line: "Laughter rolls to the back row." };
  if (s.justice >= 75) return { kind: "applause", line: "A smaller, better kind of applause." };
  if (s.ratings < 38 && s.justice < 42) return { kind: "boo", line: "Someone boos. Marla finds them with her eyes." };
  return { kind: "murmur", line: "A thoughtful murmur, which television fears." };
}

function marlaOn(s) {
  if (s.justice >= 80 && s.ratings >= 70) return "Marla, quietly: Don't let Dex see you can do both. He'll get ideas.";
  if (s.justice >= 80) return "Marla: That was correct. I'll tell the gallery to cope.";
  if (s.ratings >= 80 && s.justice < 45) return "Marla: They'll replay that. The file will not.";
  if (s.justice < 35) return "Marla: I'll hold the door for the ombudsman. He loves a redo.";
  return "Marla: We're still on the air. Try to look like that was the plan.";
}

function unlockCheck() {
  const cases = G.stats.cases;
  const avgJ = G.career.cases ? G.career.justiceSum / G.career.cases : 0;
  const fresh = [];
  UPGRADES.forEach((u) => {
    if (G.upgrades.includes(u.id)) return;
    const n = u.need;
    const ok = (n.ratings == null || G.ratings >= n.ratings || G.peak.ratings >= n.ratings)
      && (n.rep == null || G.reputation >= n.rep || G.peak.reputation >= n.rep)
      && (n.justice == null || avgJ >= n.justice)
      && (n.cases == null || cases >= n.cases)
      && (n.season == null || G.season >= n.season);
    if (!ok) return;
    G.upgrades.push(u.id);
    G.pendingUnlocks.push(u.id);
    G.equipped[u.slot] = u.value;
    fresh.push(u.id);
  });
  return fresh;
}

function achieveCheck() {
  const got = [];
  ACHIEVEMENTS.forEach((a) => {
    if (G.achievements.includes(a.id)) return;
    if (a.test(G)) {
      G.achievements.push(a.id);
      got.push(a.id);

  return got;
}

function applyScore(s) {
  const beforeRep = G.reputation;
  G.justice = clamp(Math.round(G.justice * 0.72 + s.justice * 0.28));
  G.ratings = clamp(Math.round(G.ratings * 0.72 + s.ratings * 0.28));
  const repDelta = Math.round((s.justice - 55) / 10 + (s.ratings - 50) / 16);
  G.reputation = clamp(G.reputation + repDelta);
  G.peak.justice = Math.max(G.peak.justice, G.justice);
  G.peak.ratings = Math.max(G.peak.ratings, G.ratings);
  G.peak.reputation = Math.max(G.peak.reputation, G.reputation);
  G.stats.cases += 1;
  G.career.cases += 1;
  G.career.justiceSum += s.justice;
  G.career.ratingsSum += s.ratings;
  if (s.ruling === s.fairWinner) G.stats.correctParty += 1;
  if (s.ruling === "split" && s.fairWinner === "split") G.stats.correctSplits += 1;
  if ((G.runtime.asked || []).length === 0 && s.justice >= 70) G.stats.gutRights += 1;
  G.stats.bestJustice = Math.max(G.stats.bestJustice, s.justice);
  G.stats.bestRatings = Math.max(G.stats.bestRatings, s.ratings);
  if (s.justice >= 70 && s.ratings >= 70) G.stats.boths += 1;
  if (s.justice <= 25 && s.ratings >= 80) G.stats.disasters += 1;
  const c = current();
  if (s.ruling === s.fairWinner && s.damages === s.fairDamages && s.fairDamages === c.claim && c.claim > 0) G.stats.fullFair += 1;
  G.history.unshift({
    id: c.id, title: c.title, justice: s.justice, ratings: s.ratings,
    ruling: s.ruling, fair: s.fairWinner, season: G.season, episode: G.episode,
  });
  if (G.history.length > 60) G.history.pop();
  const objectionFair = !!(c.objection && G.runtime.objectionChoice && ((G.runtime.objectionChoice === "sustain") === !!c.objection.sustainFair));
  G.episodeResults.push({
    title: c.title, justice: s.justice, ratings: s.ratings, ruling: s.ruling,
    damages: s.damages, claim: c.claim, fairDamages: s.fairDamages, keysFound: s.found, objectionFair,
  });
  if (!c.appeal && s.justice < 42 && !G.appeals.some((a) => !a.used && a.caseDef && a.caseDef.id === c.id)) {
    G.appeals.push({
      due: G.absoluteEpisode + 2,
      used: false,
      oldJustice: s.justice,
      oldRuling: s.ruling,
      oldDamages: s.damages,
      caseDef: clone(c),
    });
    const unused = G.appeals.filter((a) => !a.used);
    if (unused.length > 3) {
      const drop = unused[0];
      G.appeals = G.appeals.filter((a) => a !== drop);
    }
    s.appealed = true;
  }
  if (c.appeal) {
    if (s.justice >= c.appeal.oldJustice + 8) {
      G.stats.appealsFixed += 1;
      G.reputation = clamp(G.reputation + 3);
      G.peak.reputation = Math.max(G.peak.reputation, G.reputation);
      s.appealNote = "You were righter than last time. The ombudsman unclenches.";
    } else if (s.ruling === c.appeal.oldRuling && s.justice <= c.appeal.oldJustice + 2) {
      G.reputation = clamp(G.reputation - 2);
      s.appealNote = "You doubled down. The gallery may cheer. The file does not.";
    } else s.appealNote = "The appeal is done. Nobody gets to be un-televised.";
  }
  s.repDelta = G.reputation - beforeRep;
  s.meterJ = G.justice;
  s.meterR = G.ratings;
  s.meterP = G.reputation;
  unlockCheck();
  s.newAchievements = achieveCheck();
  s.repDelta = G.reputation - beforeRep;
}

function phasesFor(c) {
  const p = ["docket", "statement-p", "statement-d"];
  if (c.objection && c.objection.when === "statements") p.push("objection");
  p.push("evidence");
  if (c.objection && c.objection.when === "evidence") p.push("objection");
  p.push("questions");
  if (c.objection && c.objection.when === "questions") p.push("objection");
  if (c.outburst) p.push("outburst");
  p.push("verdict", "result");
  return p;
}
function goPhase(phase) {
  G.phase = phase;
  save();
  render();
}
function advance() {
  const c = current();
  const order = phasesFor(c);
  let i = order.indexOf(G.phase);
  if (i < 0) i = 0;
  let next = order[i + 1];
  while (next === "objection" && G.runtime && G.runtime.objectionChoice) {
    i += 1;
    next = order[i + 1];
  }
  if (!next) return;
  if (next === "verdict") enterVerdict();
  else goPhase(next);
}
function beginCase() {
  const c = current();
  G.runtime = {
    asked: [], inspected: [], objectionChoice: null, outburstDone: false, gavelTaps: 0,
    ruling: null, damages: null, counterOn: false, counterAmt: 0, remark: null,
    tab: "plaintiff", result: null, budget: c.appeal ? Math.max(2, budgetFor() - 1) : budgetFor(),
    openEvidence: "",
  };
  G.castLines = [];
  (c.cast || []).forEach((id) => {
    G.castSeen[id] = (G.castSeen[id] || 0) + 1;
    if (G.castSeen[id] > 1 && CAST[id]) G.castLines.push(CAST[id].name + " is back. Appearance number " + G.castSeen[id] + ". Marla saved them a look.");
  });
}

function takeAuthored() {
  const min = G.season <= 1 ? 1 : 2;
  const max = G.season <= 1 ? 2 : 3;
  let pool = CASES.filter((c) => !G.seen.includes(c.id) && c.tier >= min && c.tier <= max);
  if (!pool.length) pool = CASES.filter((c) => !G.seen.includes(c.id) && c.tier <= max + 1);
  if (!pool.length) pool = CASES.filter((c) => !G.seen.includes(c.id));
  if (!pool.length) return null;
  const c = pool[Math.floor(rand(G) * pool.length)];
  G.seen.push(c.id);
  return clone(c);
}
function makeAppeal(rec) {
  const c = clone(rec.caseDef);
  c.appeal = { oldJustice: rec.oldJustice, oldRuling: rec.oldRuling, oldDamages: rec.oldDamages };
  c.title = "Appeal: " + String(c.title).replace(/^Appeal:\s*/, "");
  c.evidence = (c.evidence || []).concat([{
    id: "ombudsman-file",
    kind: "File",
    title: "Ombudsman's addendum",
    key: true,
    body: "Staff pulled the recording and circled this: " + c.truth.summary,
  }]);
  const qTo = c.witness ? "witness" : "plaintiff";
  c.questions = (c.questions || []).concat([{
    id: "ombuds-q",
    to: qTo,
    ask: "The ombudsman sent a note. What did the staff finally circle?",
    answer: c.truth.summary,
    drama: 3,
    key: true,
    flag: "new",
  }]);
  c.baseDrama = Math.min(14, (c.baseDrama || 6) + 2);
  return c;
}
function pickDocket() {
  const docket = [];
  const appeal = G.appeals.find((a) => !a.used && a.due <= G.absoluteEpisode);
  if (appeal) {
    appeal.used = true;
    docket.push(makeAppeal(appeal));
  }
  const wantGen = G.absoluteEpisode >= 2 ? (G.season >= 3 ? 2 : 1) : 0;
  const authoredSlots = Math.max(0, 3 - docket.length - wantGen);
  for (let i = 0; i < authoredSlots; i += 1) {
    const c = takeAuthored();
    if (!c) break;
    docket.push(c);

  fake.castSeen = { doug: 1, carol: 1, lila: 1 };
  for (let i = 0; i < 24; i += 1) problems.push.apply(problems, problemsIn(generateCase(fake)));
  return problems;
}

      <div class="gavel-hero">${gavelSVG().replace("gavel", "gavel")}</div>
      <p class="quote">“All rise. The plant has immunity.”<br>— Bailiff Marla Quinn</p>
      ${save ? `<article class="paper"><div class="kicker">Saved show</div><h2>${esc(save.judgeName)}</h2><p>Season ${save.season}, episode ${save.episode}. Justice ${save.justice} · Ratings ${save.ratings} · Rep ${save.reputation}.</p>${save.history && save.history[0] ? `<p>Last ruling: ${esc(save.history[0].title)}.</p>` : ""}</article>
        <button type="button" class="go" data-act="continue">Continue the docket</button>` : `<button type="button" class="go" data-act="new-game">Take the bench</button>`}
      ${save ? `<button type="button" class="ghost" data-act="new-game">Start a new show</button>` : ""}
      <div class="row">
        <button type="button" class="ghost" data-act="title-howto">How to play</button>
        <button type="button" class="ghost" data-act="title-ach">Trophies</button>
      </div>
      <button type="button" class="ghost" data-act="title-settings">Sound &amp; vibration</button>
      <p class="fine">A fictional show from Studio B. No real court, no real network, and the goat is not available for comment. Plays offline on this phone.</p>
    </div>`;
}

function viewNaming() {
  return `<div class="poster">
      <div class="kicker light">Nameplate</div>
      <h1 class="wordmark" style="font-size:42px">Who's presiding?</h1>
      <p class="tagline">The gallery will shout it. Pick something you can live with.</p>
      <input id="judge-name" class="nameinput" maxlength="22" value="Judge Roger" autocomplete="off" aria-label="Judge name">
      <button type="button" class="go" data-act="confirm-name">That's the name</button>
      <button type="button" class="ghost" data-act="back-title">Back</button>
    </div>`;
}

function viewConfirm() {
  const c = ui.confirm;
  return `<div class="confirmback"><article class="paper"><div class="kicker">Hold on</div><h2>${esc(c.title)}</h2><p>${esc(c.text)}</p>
      <button type="button" class="go" data-act="${esc(c.yesAct)}">${esc(c.yes)}</button>
      <button type="button" class="ghost" data-act="confirm-no">${esc(c.no || "Never mind")}</button>
    </article></div>`;
}

function mainHTML() {
  const screen = viewName();
  if (screen === "title") return viewTitle();
  if (screen === "naming") return viewNaming();
  if (screen === "settings") return viewSettings();
  if (screen === "achievements") return viewAchievements();
  if (screen === "wardrobe") return viewWardrobe();
  if (screen === "howto") return viewHowto();
  if (screen === "menu") return viewMenu();
  if (screen === "confirm") return viewConfirm();
  if (!G) return viewTitle();
  if (screen === "guide") return viewGuide();
  if (screen === "episode-intro") return viewEpisode();
  if (screen === "docket") return viewDocket();
  if (screen === "statement-p") return paperPerson(current().plaintiff, "plaintiff");
  if (screen === "statement-d") return paperPerson(current().defendant, "defendant");
  if (screen === "objection") return viewObjection();
  if (screen === "evidence") return viewEvidence();
  if (screen === "questions") return viewQuestions();
  if (screen === "outburst") return viewOutburst();
  if (screen === "verdict") return viewVerdict();
  if (screen === "result") return viewResult();
  if (screen === "episode-wrap") return viewWrap();
  if (screen === "season-wrap") return viewSeason();
  return `<article class="paper"><h2>The booth lost the page.</h2><p>Step off and continue from the title.</p></article>`;
}

function dockHTML() {
  if (ui.confirm || ui.overlay || !G) return "";
  const screen = G.phase;
  if (screen === "guide") {
    const last = (G.guideStep || 0) >= GUIDE.length - 1;
    return `<div class="dock"><div class="row"><button type="button" class="ghost" data-act="skip-guide">Skip</button><button type="button" class="go" data-act="guide-next">${last ? "Open the doors" : "Next"}</button></div></div>`;
  }
  if (screen === "episode-intro") return dock("Bring in the gallery", "start-show");
  if (screen === "docket") return dock("Call the case", "advance");
  if (screen === "statement-p" || screen === "statement-d") return dock("Next", "advance");
  if (screen === "evidence") return dock("On to questions", "advance");
  if (screen === "questions") return dock("I've heard enough", "advance");
  if (screen === "outburst") return dock("Bang the gavel. Order.", "order");
  if (screen === "verdict") {
    const ready = G.runtime && G.runtime.ruling && G.runtime.remark;
    return dock("Bang the verdict", "bang", !!ready);
  }
  if (screen === "result") {
    const last = G.caseIndex >= (G.docket.length - 1);
    return dock(last ? "Wrap the episode" : "Next case", "next-case");
  }
  if (screen === "episode-wrap") return dock(G.episode >= 5 ? "Season review" : "Next episode", "wrap-next");
  if (screen === "season-wrap") return dock("Start the next season", "next-season");
  return "";
}

function render() {
  const app = document.getElementById("app");
  if (!app) return;
  const screen = viewName();
  app.dataset.phase = screen;
  app.dataset.playing = G ? "1" : "0";
  const framed = ["title", "naming", "settings", "achievements", "wardrobe", "howto", "menu", "confirm"].includes(screen);
  if (framed && !G) {
    app.innerHTML = mainHTML() + (ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : "");
    return;
  }
  if (framed) {
    app.innerHTML = mainHTML() + (ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : "");
    return;
  }
  app.innerHTML = headerHTML() + courtHTML() + `<div class="scroll">${mainHTML()}</div>` + dockHTML() + (ui.toast ? `<div class="toast">${esc(ui.toast)}</div>` : "");
}

function enterVerdict() {
  const c = current();
  const r = G.runtime;
  if (r.damages == null) r.damages = roundTo(c.claim / 2, stepFor(c.claim));
  if (r.counterAmt == null) r.counterAmt = 0;
  G.phase = "verdict";
  save();
  render();
}

function bangVerdict() {
  if (!G.runtime || !G.runtime.ruling || !G.runtime.remark || G.runtime.result) return;
  doGavel(true);
  const scored = scoreCurrent();
  applyScore(scored);
  G.runtime.result = scored;
  G.phase = "result";
  save();
  setTimeout(() => {
    if (!G || G.phase !== "result") return;
    render();
    punchReaction(scored.audience.kind);
  }, 340);
}

function nextCase() {
  if (!G.runtime || !G.runtime.result) return;
  G.caseIndex += 1;
  G.runtime = null;
  G.castLines = [];
  if (G.caseIndex >= G.docket.length) enterWrap();
  else {
    beginCase();
    G.phase = "docket";
    save();
    render();
    audio.fanfare();
  }
}

function enterWrap() {
  if (!G.episodeRewarded) {
    const rs = G.episodeResults;
    const goal = G.goal ? goalById(G.goal.id) : null;
    const met = goal ? !!goal.test(rs) : false;
    if (met) {
      G.stats.goalsHit += 1;
      G.reputation = clamp(G.reputation + 4);
      G.ratings = clamp(Math.round(G.ratings + 2));
      G.peak.ratings = Math.max(G.peak.ratings, G.ratings);
      G.peak.reputation = Math.max(G.peak.reputation, G.reputation);
    }
    G.seasonLog.push({
      season: G.season,
      episode: G.episode,
      title: episodeTitle(),
      avgJ: Math.round(avg(rs.map((r) => r.justice))),
      avgR: Math.round(avg(rs.map((r) => r.ratings))),
      met,
    });
    G.episodeRewarded = true;
    unlockCheck();
    achieveCheck();
  }
  G.phase = "episode-wrap";
  save();
  render();
}

function onWrapContinue() {
  G.pendingUnlocks = [];
  if (G.episode >= 5) {
    if (!G.seasonRewarded) {
      G.stats.seasons += 1;
      G.reputation = clamp(G.reputation + 2);
      G.peak.reputation = Math.max(G.peak.reputation, G.reputation);
      unlockCheck();
      achieveCheck();
      G.seasonRewarded = true;
    }
    G.phase = "season-wrap";
    save();
    render();
    return;
  }
  G.episode += 1;
  G.absoluteEpisode += 1;
  startEpisodeState();
  save();
  render();
}

function onNextSeason() {
  G.pendingUnlocks = [];
  G.season += 1;
  G.episode = 1;
  G.absoluteEpisode += 1;
  G.seasonRewarded = false;
  startEpisodeState();
  save();
  render();
}

function startGame(name) {
  G = newGame(name);
  G.guideSeen = false;
  G.guideStep = 0;
  startEpisodeState();
  G.phase = "guide";
  ui.overlay = null;
  ui.confirm = null;
  ui.screen = "play";
  save();
  render();
}

function onClick(event) {
  const node = event.target.closest("[data-act]");
  if (!node || node.disabled) return;
  const act = node.dataset.act;
  const id = node.dataset.id || "";
  if (act === "gavel-free") {
    audio.context();
    doGavel(false);
    return;
  }
  if (act === "new-game") {
    audio.fanfare();
    const existing = loadSave();
    if (existing) {
      ui.confirm = { title: "Start a new show?", text: "This replaces " + existing.judgeName + "'s saved docket on this phone.", yes: "Replace it", yesAct: "really-new", no: "Keep the old show" };
      render();
    } else {
      ui.screen = "naming";
      render();
    }
    return;
  }
  if (act === "really-new") {
    ui.confirm = null;
    ui.screen = "naming";
    render();
    return;
  }
  if (act === "confirm-no") {
    ui.confirm = null;
    render();
    return;
  }
  if (act === "confirm-name") {
    const input = document.getElementById("judge-name");
    startGame(input ? input.value : "Judge Roger");
    return;
  }
  if (act === "back-title" || act === "exit-title") {
    if (G) save();
    G = null;
    ui.overlay = null;
    ui.confirm = null;
    ui.screen = "title";
    render();
    return;
  }
  if (act === "continue") {
    const saveGame = loadSave();
    if (!saveGame) return;
    G = saveGame;
    ui.overlay = null;
    ui.screen = "play";
    render();
    audio.fanfare();
    return;
  }
  if (act === "title-settings") { ui.screen = "settings"; render(); return; }
  if (act === "title-ach") { ui.screen = "achievements"; render(); return; }
  if (act === "title-howto") { ui.screen = "howto"; render(); return; }
  if (act === "open-menu") { ui.overlay = "menu"; render(); return; }
  if (act === "open-settings") { ui.overlay = "settings"; render(); return; }
  if (act === "open-achievements") { ui.overlay = "achievements"; render(); return; }
  if (act === "open-wardrobe") { ui.overlay = "wardrobe"; render(); return; }
  if (act === "open-howto") { ui.overlay = "howto"; render(); return; }
  if (act === "close-overlay") { ui.overlay = null; render(); return; }
  if (act === "settings-back") {
    if (G && ui.overlay) ui.overlay = null;
    else ui.screen = "title";
    render();
    return;
  }
  if (act === "toggle-setting") {
    if (id === "sound") settings.sound = !settings.sound;
    if (id === "vibrate") settings.vibrate = !settings.vibrate;
    saveSettings();
    if (settings.sound && id === "sound") audio.gavel("wood");
    render();
    return;
  }
  if (act === "erase-ask") {
    ui.confirm = { title: "Erase the saved show?", text: "Achievements, seasons, and the nameplate go with it.", yes: "Erase it", yesAct: "really-erase", no: "Keep it" };
    render();
    return;
  }
  if (act === "really-erase") {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* already gone */ }
    ui.confirm = null;
    G = null;
    ui.screen = "title";
    ui.overlay = null;
    render();
    return;
  }
  if (act === "equip") {
    const slot = node.dataset.slot;
    if (slot && G) {
      G.equipped[slot] = id;
      save();
      render();
    }
    return;
  }
  if (!G) return;
  if (act === "skip-guide" || act === "guide-next") {
    if (act === "guide-next" && (G.guideStep || 0) < GUIDE.length - 1) {
      G.guideStep += 1;
      save();
      render();
      return;
    }
    G.guideSeen = true;
    G.phase = "episode-intro";
    save();
    render();
    return;
  }
  if (act === "start-show") {
    beginCase();
    G.phase = "docket";
    save();
    render();
    doGavel(true);
    return;
  }
  if (act === "advance") {
    advance();
    return;
  }
  if (act === "inspect") {
    if (!G.runtime.inspected.includes(id)) G.runtime.inspected.push(id);
    G.runtime.openEvidence = id;
    save();
    render();
    return;
  }
  if (act === "tab") {
    G.runtime.tab = id;
    render();
    return;
  }
  if (act === "ask") {
    const c = current();
    const q = c.questions.find((item) => item.id === id);
    if (!q || G.runtime.asked.includes(id)) return;
    if (G.runtime.asked.length >= G.runtime.budget) return;
    G.runtime.asked.push(id);
    if (q.flag === "lie" || q.flag === "contradiction") audio.gasp();
    else if ((q.drama || 0) >= 7) audio.laugh();
    if (c.objection && c.objection.when === "questions" && !G.runtime.objectionChoice && G.runtime.asked.length >= 2) {
      G.phase = "objection";
      G.runtime.returnTo = "questions";
    }
    save();
    render();
    return;
  }
  if (act === "sustain" || act === "overrule") {
    G.runtime.objectionChoice = act === "sustain" ? "sustain" : "overrule";
    audio.objection();
    const back = G.runtime.returnTo;
    G.runtime.returnTo = "";
    if (back) G.phase = back;
    else advance();
    save();
    render();
    return;
  }
  if (act === "order") {
    if (G.runtime.outburstDone) return;
    G.runtime.outburstDone = true;
    G.stats.outbursts += 1;
    doGavel(true);
    const order = phasesFor(current());
    const i = order.indexOf("outburst");
    G.phase = order[i + 1] || "verdict";
    if (G.phase === "verdict") {
      const c = current();
      if (G.runtime.damages == null) G.runtime.damages = roundTo(c.claim / 2, stepFor(c.claim));
    }
    save();
    setTimeout(() => { if (G) render(); }, 280);
    return;
  }
  if (act === "ruling") {
    G.runtime.ruling = id;
    save();
    render();
    return;
  }
  if (act === "remark") {
    G.runtime.remark = id;
    save();
    render();
    return;
  }
  if (act === "set-damages") {
    const c = current();
    if (id === "0") G.runtime.damages = 0;
    else if (id === "full") G.runtime.damages = c.claim;
    else G.runtime.damages = roundTo(c.claim / 2, stepFor(c.claim));
    save();
    render();
    return;
  }
  if (act === "toggle-counter") {
    G.runtime.counterOn = !G.runtime.counterOn;
    if (G.runtime.counterOn && !G.runtime.counterAmt) {
      const c = current();
      G.runtime.counterAmt = roundTo(c.counter / 2, stepFor(c.counter));
    }
    save();
    render();
    return;
  }
  if (act === "bang") {
    bangVerdict();
    return;
  }
  if (act === "next-case") {
    nextCase();
    return;
  }
  if (act === "wrap-next") {
    onWrapContinue();
    return;
  }
  if (act === "next-season") {
    onNextSeason();
    return;
  }
}

function onInput(event) {
  const node = event.target;
  if (!node || !G || !G.runtime) return;
  if (node.dataset.act === "damages") {
    G.runtime.damages = Number(node.value);
    const label = document.getElementById("damages-readout");
    if (label) label.textContent = money(G.runtime.damages);
  }
  if (node.dataset.act === "counter") {
    G.runtime.counterAmt = Number(node.value);
    const label = document.getElementById("counter-readout");
    if (label) label.textContent = money(G.runtime.counterAmt);
  }
}

function registerSW() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
}

function boot() {
  settings = loadSettings();
  const app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("input", onInput);
  ui.screen = "title";
  render();
  registerSW();
}

if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}

</script>
</body>
</html>
